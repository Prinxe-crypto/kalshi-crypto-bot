name: Run Kalshi Demo Bot

on:
  workflow_dispatch:
  schedule:
    # Runs every hour on the hour (UTC time)
    # You can adjust this schedule as needed (e.g., '*/30 * * * *' for every 30 mins)
    - cron: '0 * * * *'

jobs:
  execute-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cryptography

      - name: Run Bot Script
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python bot.py
